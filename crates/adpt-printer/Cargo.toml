[package]
name = "adpt-printer"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
description = "The campus Kyocera printer for IsctCompanion Core: student IDs, and LPD and PJL for Windows"
publish = false

# The LPD client, PJL header and document upload are Windows only.
[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
# Decode common raster formats and render them into a PDF page before LPD send.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
printpdf = { version = "0.12.8", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
# RFC 1179 clients send from a port below 1024; std cannot bind before connecting.
socket2 = "0.6"

[target.'cfg(windows)'.dev-dependencies]
serde_json = "1"
